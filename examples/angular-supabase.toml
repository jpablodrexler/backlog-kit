# Example: an Angular frontend talking straight to a hosted Supabase project, with Cypress
# component tests, a mocked end-to-end tier, and a live-backend end-to-end tier. This is the
# pipeline backlog-kit was extracted from, written as configuration — nothing here is built in.
# Copy to <repo>/.backlog-kit.toml and adapt.

[git]
base_branch    = "develop"
feature_prefix = "feature/"
fix_prefix     = "fix/"

[guidance]
regression_tests = """
Component and service tests live next to the source as *.cy.ts (Cypress Component Testing);
prefer extending the relevant existing spec. A bug visible only through a full page flow goes
under frontend/cypress/e2e/mocked/. A row-level-security or SQL-function bug gets a pgTAP
assertion under supabase/tests/. Run one file with:
  cd frontend && npx cypress run --component --spec 'src/app/<path>.cy.ts'
"""

[docs]
sync_skill = "web-docs-sync"

# --- gates: always run, in order -------------------------------------------------------------
[[gates]]
name = "component tests"
run  = "npm run test"
cwd  = "frontend"

[[gates]]
name = "mocked e2e"
run  = "npm run test:e2e:mocked"
cwd  = "frontend"
timeout_minutes = 10

[[gates]]
name = "production build"
run  = "npm run build"
cwd  = "frontend"

# Only when auth, the task list, documents or a migration changed — and only after asking,
# because it runs against the real linked project with a real login.
[[gates]]
name = "live e2e"
run  = "npm run test:e2e"
cwd  = "frontend"
when = ["frontend/src/app/login/**", "frontend/src/app/register/**", "frontend/src/app/core/auth*",
        "frontend/src/app/task-list/**", "frontend/src/app/documents/**", "supabase/migrations/**"]
ask_before = "This runs against the real linked Supabase project with a real login. Run the live e2e gate?"
timeout_minutes = 20

# --- reviews ---------------------------------------------------------------------------------
[[reviews]]
name  = "code"
skill = "code-reviewer"          # delegate to the project's own review skill
when  = ["**"]

[[reviews]]
name  = "database"
skill = "database-reviewer"
when  = ["supabase/migrations/**"]

[[reviews]]
name  = "security"
skill = "security-reviewer"
when  = ["frontend/src/app/core/auth*", "frontend/src/app/login/**", "frontend/src/app/register/**",
         "supabase/migrations/**", "**/package.json"]

# No skill: the built-in reviewer is given this focus and writes its own report.
[[reviews]]
name  = "layout"
focus = "responsive layout: at a 384x824 phone viewport check for overlapping or clipped content and horizontal scroll; at 1920x1080 check nothing stays pinned to a mobile-sized width"
when  = ["frontend/src/app/**/*.html", "frontend/src/app/**/*.css", "frontend/src/app/**/*.scss"]
