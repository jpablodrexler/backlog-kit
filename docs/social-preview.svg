<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">backlog-kit</title>
  <desc id="d">Claude Code skills. Your backlog is plain markdown. Claude works it to done through quality gates. The loop: Backlog, Develop, Verify, Ship, and back to the backlog. Nothing is committed without you.</desc>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#d97757"/>

  <!-- label -->
  <text x="1200" y="110" text-anchor="end" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e">Claude Code skills</text>

  <!-- title -->
  <text x="80" y="170" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="96" font-weight="700" fill="#ffffff">backlog-kit</text>

  <!-- tagline -->
  <text x="80" y="250" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="42" fill="#c9d1d9">Your backlog is <tspan fill="#d97757" font-weight="600">plain markdown</tspan>.</text>
  <text x="80" y="304" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="42" fill="#c9d1d9">Claude works it to done through <tspan fill="#d97757" font-weight="600">quality gates</tspan>.</text>

  <!-- loop -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="80"  y="360" width="220" height="72" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="190" y="406">Backlog</text>
    <rect x="340" y="360" width="220" height="72" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="450" y="406">Develop</text>
    <rect x="600" y="360" width="220" height="72" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="710" y="406">Verify</text>
    <rect x="860" y="360" width="220" height="72" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="970" y="406">Ship</text>
  </g>
  <g fill="#d97757">
    <path d="M304 396 h24 v-8 l12 8 l-12 8 v-8 z"/>
    <path d="M564 396 h24 v-8 l12 8 l-12 8 v-8 z"/>
    <path d="M824 396 h24 v-8 l12 8 l-12 8 v-8 z"/>
  </g>
  <!-- return arrow: Ship back to Backlog -->
  <path d="M970 436 V462 H190 V444" fill="none" stroke="#d97757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 446 L190 434 L200 446 Z" fill="#d97757"/>

  <!-- footer chip -->
  <rect x="80" y="500" width="480" height="56" rx="28" fill="none" stroke="#d97757" stroke-width="2"/>
  <text x="320" y="537" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Nothing is committed without you.</text>
</svg>
