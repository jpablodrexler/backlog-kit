# Copy to <your-repo>/.backlog-kit.toml. The file is optional: with none, the defaults below apply.
# Requires Python 3.11+ to be read.

[paths]
# The one folder setting. The decisions, explorations and reports folders sit next to it
# (<docs>/decisions, <docs>/explorations, <docs>/reports, where <docs> contains the backlog folder).
backlog_dir = "docs/backlog"        # features-*.md, bugs-*.md, features/, bugs/

[git]
# The long-lived branches gitflow, feature-development and bug-fix work against. These are the defaults.
# Trunk-based project: set both to the same branch (e.g. "main"); releases then open one PR instead of two.
integration_branch = "develop"      # topic branches start here and PR into it
production_branch = "main"          # releases and hotfixes land here and get the version tag
host = "auto"                        # github | gitlab | other; auto reads the origin URL (set it for a self-hosted GitHub or GitLab)

[cycles]
# The length of a cycle in weeks: backlog-forecast and backlog-cycle plan, close and calibrate in cycles of this length.
weeks = 2

[viewports]
# Devices the viewport check of feature-development and bug-fix verifies when a change touches the UI
# (it runs only if the project can render the view). Entries are "Name WIDTHxHEIGHT" in CSS pixels.
# These are the defaults; delete the section to keep them.
phones = ["Galaxy S23 Ultra 384x824"]
desktop = "1920x1080"
# Popular phones you may add (sizes are approximate, check them against your own device list):
#   "iPhone 17 402x874", "iPhone 16 390x844", "Galaxy S26 Ultra 412x915",
#   "Galaxy A16 384x854", "Pixel 9 412x915"

# Nothing else is configured: the skills ask you when they need to know something about your project.
#
# Priorities (P0-P3), efforts (story points 1/2/3/5/8/13), severities (S1-S4), the bug id prefix (BUG), the Schema Change
# column, the branch prefixes (feature/, fix/, ...) and OpenSpec's location (openspec/changes) are
# fixed, as in the projects the kit comes from; the Area and Environment values are whatever the legend
# of your backlog files says.
