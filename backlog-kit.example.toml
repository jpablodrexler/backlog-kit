# Copy to <your-repo>/.backlog-kit.toml. Every key is optional — anything you
# leave out falls back to the default shown here. Requires Python 3.11+ to be read.

[paths]
backlog_dir      = "docs/backlog"        # features-*.md, bugs-*.md, features/, bugs/
decisions_dir    = "docs/decisions"      # ADRs (decision-record)
explorations_dir = "docs/explorations"   # optional; features-next offers open explorations
reports_dir      = "docs/reports"        # review reports written by bug-fix / feature-development

[features]
# Ordered highest -> lowest. Position drives scoring: with 4 tiers the top one
# scores 400, then 300, 200, 100. Rename or resize freely.
priorities = ["P0", "P1", "P2", "P3"]
# Ordered smallest -> largest. The first entry earns features-next's small-effort bonus.
efforts    = ["S", "M", "L"]
areas      = ["Frontend", "Backend", "Full-stack"]

[features.priority_labels]
P0 = "production-safety / security / data-loss gap"
P1 = "high-impact"
P2 = "scalability / quality"
P3 = "convenience"

[bugs]
id_prefix = "BUG"                          # ids look like BUG-001
# Ordered most -> least severe.
severities = ["S1", "S2", "S3", "S4"]
environments = ["local", "prod", "both"]
# Environments that earn bugs-next's "hurting real users now" bonus.
prod_environments = ["prod", "both"]

[bugs.severity_labels]
S1 = "blocker - app unusable, data loss or security hole"
S2 = "major - a feature is broken with no workaround"
S3 = "minor - impaired, but there is a workaround"
S4 = "trivial - cosmetic or copy"

[spec]
# "none" (default) or "openspec". backlog-kit never bundles OpenSpec; with
# "openspec" the planned table gains an `SDD Artifacts` column and archived rows
# link the archived change's proposal.md. Install OpenSpec separately.
workflow    = "none"
changes_dir = "openspec/changes"

# ---- bug-fix / feature-development -----------------------------------------------------------

[git]
# Empty = detect from origin/HEAD, then main / master / develop / trunk. The work skills only
# ever create or switch branches and fast-forward them; they never commit, push or merge.
base_branch    = ""
feature_prefix = "feature/"
fix_prefix     = "fix/"
# The skill named in the hand-off message for committing and opening the PR. The plugin ships `gitflow`
# (commit / finish / cleanup, each after asking you). Set your own skill name instead, or "" to say
# "commit and open the PR yourself". The work skills only ever name it; they never run it.
finish_skill   = "gitflow"

[work]
review_max_rounds = 3     # review-and-fix rounds before the run stops and asks a human
gate_max_rounds   = 3     # fix-and-rerun rounds for ONE failing gate before the run stops (GATES_BLOCKED)

[guidance]
# Free text for the subagent that writes a bug's failing regression test.
regression_tests = ""

[docs]
# Optional skill invoked best-effort when closing work, to keep reference docs current.
sync_skill = ""

# Verification gates, run in order after the work and its reviews. With none configured, the
# first run sniffs the repo (package.json scripts, pytest, mvn/gradle, dotnet, go, cargo,
# `make test`), proposes some, and asks before saving them here. Each entry:
#   name, run, cwd = ".", when = ["**"] (globs on changed files), ask_before = "" (a question to
#   put to the user first, e.g. for a gate that touches a live service), timeout_minutes = 10,
#   known_failures = [] (test names or patterns that already fail for reasons unrelated to your
#   changes — reported as KNOWN FAILURE and not fixed, instead of blocking every run).
#
# [[gates]]
# name = "tests"
# run  = "npm test"
#
# [[gates]]
# name = "build"
# run  = "npm run build"

# Reviews run on the changed files. With none configured, one built-in "code" review applies.
# Each entry: name, focus (what to look for), skill (optional: delegate to a project review
# skill instead of the built-in reviewer), when = ["**"].
#
# [[reviews]]
# name  = "security"
# focus = "auth, input handling, secrets, dependency changes"
# when  = ["**/auth/**", "**/package.json"]

# See examples/angular-supabase.toml for a complete worked configuration.
